[package]
name = "orbitdeck-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
orbitdeck = { path = ".." }
libfuzzer-sys = { path = "libfuzzer-sys" }

[workspace]

[profile.release]
debug = 1
overflow-checks = true
panic = "abort"

[[bin]]
name = "bundle_fuzzer"
path = "fuzz_targets/bundle_fuzzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stream_fuzzer"
path = "fuzz_targets/stream_fuzzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plan_fuzzer"
path = "fuzz_targets/plan_fuzzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "telemetry_fuzzer"
path = "fuzz_targets/telemetry_fuzzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "script_fuzzer"
path = "fuzz_targets/script_fuzzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "eventlog_fuzzer"
path = "fuzz_targets/eventlog_fuzzer.rs"
test = false
doc = false
bench = false
